<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Opdracht 3.2</title>
</head>

<body>
    <form action="">
        <h2>Voornaam</h2>
        <input type="text" pattern="[A-Za-z]{}" required>
        <h2>tussenvoegsel</h2>
        <input type="text" pattern="[A-Za-z]{}">
        <h2>Achternaam</h2>
        <input type="text" pattern="[A-Za-z]{}" required>
        <legend>Selecteer uw gender:</legend>
        <div>
            <input type="radio" id="dhr" name="gender" value="dhr" checked />
            <label for="dhr">Dhr.</label>
        </div>
        <div>
            <input type="radio" id="mevr" name="gender" value="mevr" />
            <label for="mevr">Mevr.</label>
        </div>
        <div>
            <input type="radio" id="anders" name="gender" value="anders" />
            <label for="anders">Anders</label>
        </div>
        <h2>Straat en Huisnummer</h2>
        <input type="text" required>
        <h2>Postcode</h2>
        <input type="text" pattern="[0-9]{4}[A-Za-z]{2}" required>
        <h2>Woonplaats</h2>
        <input type="text" required> 
        <h2>Land</h2>
        <label for="landen">
            <select name="land" id="land" required>
                <option value="nederland">Nederland</option>
                <option value="deutchland">Deutchland</option>
                <option value="england">England</option>
                <option value="belgie">Belgie</option>
            </select>
        </label>
        <h2>IBAN-nummer</h2>
        <input type="text" pattern="NL[0-9]{2}[A-Z]{4}[0-9]{10}" required>
        <h2>Type abonnement</h2>
        <input type="checkbox">Mobiel
        <input type="checkbox">Glasvezel
        <input type="checkbox">TV
        <h2>Datum van ingang abonnement</h2>
        <input type="date" min="2026-09-21" required>
        <h2>Looptijd abonnement</h2>
        <label for="abonnementen"></label>
        <select name="abonnement" id="abonnement" required>
            <option value="3 maanden">3 Maanden</option>
            <option value="6 maanden">6 Maanden</option>
            <option value="12 maanden">12 Maanden</option>
            <option value="24 maanden">24 Maanden</option>
        </select>
        <h2>Aantal gebruikers op het abonnement</h2>
        <input type="number" min="1" max="4" required>
        <h2>E-mailadres</h2>
        <input type="email" required>
        <h2>Wachtwoord aanmaken</h2>
        <input type="password" required>
        <input type="submit" value="Sluit abonnement af">
    </form>
</body>

</html>
